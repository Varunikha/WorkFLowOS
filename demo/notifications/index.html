<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Team Notifications</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f6f8;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;
        }

        .container {

            width: 500px;

            background: white;

            padding: 35px;

            border-radius: 14px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.08);
        }

        h1 {

            margin-top: 0;

            color: #20242a;
        }

        p {

            color: #707780;
        }

        label {

            display: block;

            margin-top: 20px;

            margin-bottom: 7px;

            font-weight: bold;
        }

        textarea {

            width: 100%;

            height: 150px;

            padding: 12px;

            border: 1px solid #d5d9df;

            border-radius: 8px;

            font-size: 14px;
        }

        button {

            width: 100%;

            margin-top: 25px;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #7c3aed;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        #result {

            margin-top: 20px;

            padding: 15px;

            background: #f5f3ff;

            color: #5b21b6;

            border-radius: 8px;

            display: none;
        }

    </style>

</head>


<body>


<div class="container">

    <h1>Team Notifications</h1>

    <p>
        Notify the relevant team.
    </p>


    <form id="notificationForm">


        <label>
            Message
        </label>


        <textarea
            id="message"
            name="message"
            placeholder="Enter notification..."
            required
        ></textarea>


        <button type="submit">

            Send Notification

        </button>


    </form>


    <div id="result"></div>


</div>


<script>

const BACKEND_URL =
    "http://127.0.0.1:8000/events";


/* ============================================================
   WORKFLOWOS ACTIVITY TRACKER
   ============================================================ */

function trackEvent(
    eventType,
    target,
    metadata = {}
) {

    const event = {

        timestamp:
            new Date().toISOString(),

        application:
            "Team Notifications",

        event_type:
            eventType,

        window_title:
            document.title,

        metadata: {

            target: target,

            url: window.location.href,

            ...metadata
        }
    };


    fetch(
        BACKEND_URL,
        {
            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body:
                JSON.stringify(event)
        }
    )
    .catch(
        error =>
            console.error(
                "WorkFlowOS tracking error:",
                error
            )
    );
}


/* ============================================================
   PAGE OPEN
   ============================================================ */

trackEvent(
    "BROWSER_NAVIGATE",
    "Team Notifications"
);


/* ============================================================
   INPUT TRACKING
   ============================================================ */

document
    .getElementById("message")
    .addEventListener(
        "change",
        function() {

            trackEvent(
                "BROWSER_INPUT",
                "notification_message"
            );

        }
    );


/* ============================================================
   FORM SUBMISSION
   ============================================================ */

const form =
    document.getElementById(
        "notificationForm"
    );


const result =
    document.getElementById(
        "result"
    );


form.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const message =
            document.getElementById(
                "message"
            ).value;


        trackEvent(
            "BROWSER_SUBMIT",
            "team_notification",
            {
                message: message
            }
        );


        result.style.display =
            "block";


        result.innerHTML =
            `
            <strong>
                Notification sent successfully.
            </strong>

            <br><br>

            Team has been notified.
            `;

    }
);

</script>


</body>

</html>
